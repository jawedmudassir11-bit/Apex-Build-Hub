<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Scripting Library</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151e2e;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent: #00e5ff;
            --accent-hover: #00b3cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 { color: var(--text-main); margin-bottom: 1rem; }
        header h1 span { color: var(--accent); }
        
        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            transition: 0.3s;
        }
        
        .back-btn:hover { 
            background-color: rgba(0, 229, 255, 0.1); 
            border-color: var(--accent); 
            color: var(--accent); 
        }

        .submit-section { 
            background-color: var(--card-bg); 
            padding: 2rem; 
            border-radius: 12px; 
            border: 1px solid #1f2937; 
            margin-bottom: 3rem; 
            margin-top: 2rem; 
        }
        
        .submit-section h2 { margin-bottom: 1.5rem; font-size: 1.25rem; }

        input, textarea { 
            width: 100%; 
            background-color: #0b0f19; 
            border: 1px solid #334155; 
            color: var(--text-main); 
            padding: 1rem; 
            border-radius: 6px; 
            margin-bottom: 1rem; 
            font-size: 1rem; 
            transition: 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 5px rgba(0, 229, 255, 0.3);
        }

        textarea { resize: vertical; height: 150px; font-family: monospace; }
        
        button { 
            background: linear-gradient(90deg, #0f766e, #06b6d4);
            color: #fff; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: bold;
            transition: 0.3s; 
        }
        
        button:hover { 
            background: linear-gradient(90deg, #115e59, #0891b2);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        .feed-section h2 { margin-bottom: 1.5rem; border-bottom: 1px solid #1f2937; padding-bottom: 0.5rem; }
        
        .script-card { 
            background-color: var(--card-bg); 
            padding: 1.5rem; 
            border-radius: 12px; 
            border: 1px solid #1f2937; 
            margin-bottom: 1.5rem; 
        }
        
        .script-card h4 { color: var(--accent); margin-bottom: 0.5rem; font-size: 1.1rem; }
        
        .script-card pre { 
            background-color: #0b0f19; 
            padding: 1.5rem; 
            border-radius: 6px; 
            overflow-x: auto; 
            border: 1px solid #1f2937; 
        }
        
        .script-card code { font-family: monospace; color: #a5b4fc; }
    </style>
</head>
<body>

    <header>
        <h1>Roblox <span>Scripting Library</span></h1>
        <a href="index.html" class="back-btn">← Back to Hub</a>
    </header>

    <div class="submit-section">
        <h2>Publish a New Script</h2>
        <form id="scriptForm">
            <input type="text" id="authorName" placeholder="Your Name (e.g. Mudassir)" required>
            <textarea id="scriptCode" placeholder="Paste your Luau script here..." required></textarea>
            <button type="submit">Publish Script</button>
        </form>
    </div>

    <div class="feed-section">
        <h2>Published Scripts</h2>
        <div id="scriptContainer">
            <!-- Scripts will load from your Firebase here -->
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://gen-lang-client-0518758555-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const scriptsRef = database.ref('published_scripts');
        const container = document.getElementById('scriptContainer');

        scriptsRef.on('child_added', (snapshot) => {
            const data = snapshot.val();
            
            const card = document.createElement('div');
            card.className = 'script-card';
            card.innerHTML = `
                <h4>Published by: ${data.name}</h4>
                <pre><code>${data.code}</code></pre>
            `;
            
            container.prepend(card);
        });

        document.getElementById('scriptForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const newName = document.getElementById('authorName').value;
            const newCode = document.getElementById('scriptCode').value;

            scriptsRef.push({
                name: newName,
                code: newCode
            });

            document.getElementById('authorName').value = '';
            document.getElementById('scriptCode').value = '';
        });
    </script>
</body>
</html>
